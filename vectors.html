<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vector Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Same look as the Physics Proving Ground: the drawing on the left, the problem and answer on the right. */
:root{
  --paper:#18212b; --sheet:#222e3b; --rule:#3d4d5e;
  --ink:#eaf0f4; --muted:#a9b6c2; --steel-lt:#6d7d8c;
  --safety:#ff8a2a; --hit:#7dffc1; --miss:#ff8b7a; --field:#0f161e; --on-safety:#20140a;
  --f-display:"Saira Stencil One", Impact, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--safety); outline-offset:2px}
.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); grid-template-columns:minmax(0,1fr) 380px; gap:10px 16px;
  padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px}
h1{margin:0; font-family:var(--f-display); font-weight:400; font-size:30px; line-height:1; letter-spacing:.02em}
.nav{display:flex; flex-wrap:wrap; gap:6px 14px; flex:1; min-width:0}
.group{display:flex; align-items:center; gap:3px; flex-wrap:wrap}
.group > span{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-right:3px}
.lv{min-width:34px; height:34px; border:1px solid var(--rule); background:var(--sheet); border-radius:3px; cursor:pointer; font-family:var(--f-mono); font-size:14px; font-weight:600; padding:0}
.lv.cur{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.lv.done{border-color:var(--hit); box-shadow:inset 0 -3px 0 var(--hit)}
.lv.cur.done{box-shadow:inset 0 -3px 0 #0f7a4d}
.total{font-family:var(--f-mono); font-size:14px; font-weight:600; white-space:nowrap}
.range{min-width:0; min-height:0; display:flex; align-items:flex-start; justify-content:center}
#scene{display:block; border:1px solid var(--rule); border-radius:4px; background:var(--field); max-width:100%}
.test{min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:6px}
.sheet{background:var(--sheet); border:1px solid var(--rule); padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.tag{font-family:var(--f-mono); font-size:13px; font-weight:600; color:var(--safety)}
h2{margin:0; font-size:20px; line-height:1.2}
.story{margin:0}
.story b{font-family:var(--f-mono); font-weight:600}
.entry{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:8px 10px}
.entry label{font-family:var(--f-mono); font-weight:600; text-align:right}
.entry input{width:8em; font-family:var(--f-mono); font-weight:600; font-size:18px; padding:6px 8px; background:var(--field); border:2px solid var(--safety); border-radius:2px; color:var(--ink)}
.entry .u{font-family:var(--f-mono); color:var(--muted); margin-left:6px}
.btn{border:1px solid var(--ink); background:transparent; padding:9px 13px; font-weight:700; cursor:pointer; border-radius:2px}
.btn.go{background:var(--safety); border-color:var(--safety); color:var(--on-safety)}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:8px}
.err{margin:0; color:var(--miss); font-weight:700; font-size:15px}
.note{margin:0; font-size:14.5px; color:var(--muted)}
.label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.result{font-weight:700; font-size:17px; margin:0}
.result.hit{color:var(--hit)} .result.miss{color:var(--miss)}
.facts{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:3px; font-size:15px}
.steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:15px}
.steps .m{font-family:var(--f-mono); font-size:14.5px}
.app.locked .nav, .app.locked .total{display:none}
.app.locked h1{font-size:22px}
html.bare, html.bare body{height:auto}
.app.bare{height:auto; grid-template-columns:minmax(0,1fr); grid-template-rows:auto}
.app.bare header, .app.bare .test{display:none}
.app.bare .range{display:block}
@media (max-width:900px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr); grid-template-rows:none; height:auto}
  .test{overflow:visible}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Vector Range</h1>
    <nav class="nav" id="nav" aria-label="Problems"></nav>
    <div class="total" id="total"></div>
  </header>
  <section class="range" id="range"><canvas id="scene" role="img" aria-label="Vector diagram on a grid"></canvas></section>
  <aside class="test">
    <section class="sheet">
      <div class="tag" id="tag"></div>
      <h2 id="qName"></h2>
      <p class="story" id="story"></p>
      <p class="note" id="dirNote"></p>
      <form class="entry" id="form" autocomplete="off"></form>
      <div class="row"><button class="btn go" id="btnGo" type="submit" form="form">Fire</button></div>
      <p class="err" id="errMsg" hidden></p>
      <p class="note">Work out your answer, then fire. The given vectors slide tip-to-tail to mark the target, and your vector is drawn from the origin.</p>
    </section>
    <section class="sheet" id="debrief" hidden>
      <p class="result" id="resultLine"></p>
      <ul class="facts" id="facts"></ul>
      <div id="stepsBox" hidden><div class="label">Worked solution</div><ol class="steps" id="steps"></ol></div>
      <div class="row">
        <button class="btn" id="btnSolve" type="button">Show worked solution</button>
        <button class="btn" id="btnFresh" type="button">New numbers</button>
        <button class="btn go" id="btnNext" type="button" hidden>Next problem</button>
      </div>
    </section>
  </aside>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rnd = (a, b, s) => { const n = Math.floor((b - a) / s + 1e-9); return +(a + s * Math.floor(Math.random() * (n + 1))).toFixed(6); };
const pick = a => a[Math.floor(Math.random() * a.length)];
const until = (make, ok) => { for (let k = 0; k < 20000; k++){ const v = make(); if (ok(v)) return v; } throw new Error('no valid numbers'); };
const pol = (m, d) => [m * Math.cos(d * D2R), m * Math.sin(d * D2R)];
const len = v => Math.hypot(v[0], v[1]);
const ang = v => { let t = Math.atan2(v[1], v[0]) / D2R; if (t < 0) t += 360; if (t >= 360) t -= 360; return t; };
const sum = vs => vs.reduce((a, v) => [a[0] + v[0], a[1] + v[1]], [0, 0]);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const minus = s => String(s).replace(/^-/, '−');
const f = x => { if (!isFinite(x)) return '∞'; if (Math.abs(x) < 5e-10) return '0'; const a = Math.abs(x); return minus(a >= 100 ? x.toFixed(0) : a >= 10 ? x.toFixed(1) : a >= 1 ? x.toFixed(2) : x.toFixed(3)); };
const fd = d => `${d.toFixed(1)}°`;
const comp = (x, y) => `(${minus(x)} î ${y < 0 ? '−' : '+'} ${Math.abs(y)} ĵ)`;
const DIR = 'Give the direction in degrees, measured counterclockwise from the +x axis (east), between 0° and 360°.';
const C = ['#6cc4ff', '#c79bff', '#ffd25e', '#62e0b5'];   // given vectors; student = orange; answer = mint

// a vector item: {label, m, d} or {label, v:[x, y]}; neg = drawn reversed when placed tip-to-tail
const vecOf = it => { const v = it.v ? it.v.slice() : pol(it.m, it.d); return it.neg ? [-v[0], -v[1]] : v; };
const rawOf = it => it.v ? it.v.slice() : pol(it.m, it.d);
const quad = (x, y, phi) => x >= 0 && y >= 0 ? [`first quadrant, so θ = φ = ${fd(phi)}`, phi] : x < 0 && y >= 0 ? [`second quadrant, so θ = 180° − ${fd(phi)} = ${fd(180 - phi)}`, 180 - phi] : x < 0 ? [`third quadrant, so θ = 180° + ${fd(phi)} = ${fd(180 + phi)}`, 180 + phi] : [`fourth quadrant, so θ = 360° − ${fd(phi)} = ${fd(360 - phi)}`, 360 - phi];
function polarSteps(items, R, unit, name){
  const out = items.map(it => {
    const [x, y] = vecOf(it), lab = it.html || it.label;
    if (it.v) return `${it.neg ? '−' : ''}${lab}: <span class="m">x = ${f(x)} ${unit}, y = ${f(y)} ${unit}</span>${it.neg ? ' (signs flipped)' : ''}`;
    if (it.neg) return `−${lab}: flip the signs of ${lab}'s components: <span class="m">x = −(${it.m} cos ${it.d}°) = ${f(x)}, y = −(${it.m} sin ${it.d}°) = ${f(y)}</span>`;
    return `${lab}: <span class="m">x = ${it.m} cos ${it.d}° = ${f(x)}, y = ${it.m} sin ${it.d}° = ${f(y)}</span>`;
  });
  if (items.length > 1) out.push(`Add the components: <span class="m">${name}<sub>x</sub> = ${f(R[0])} ${unit}, ${name}<sub>y</sub> = ${f(R[1])} ${unit}</span>`);
  out.push(`Magnitude: <span class="m">${name} = √(${f(R[0])}² + ${f(R[1])}²) = ${f(len(R))} ${unit}</span>`);
  if (Math.abs(R[0]) < 1e-9) out.push(`Direction: the vector points straight ${R[1] > 0 ? 'up, θ = 90°' : 'down, θ = 270°'}`);
  else { const phi = Math.atan(Math.abs(R[1] / R[0])) / D2R, [txt] = quad(R[0], R[1], phi); out.push(`Reference angle: <span class="m">φ = tan⁻¹(${f(Math.abs(R[1]))}/${f(Math.abs(R[0]))}) = ${fd(phi)}</span>. The vector is in the ${txt}`); }
  return out;
}
const P2 = {rel:.02}, A1 = {abs:1, angle:true};
const polarParts = (name, unit) => [{sym:name, unit, tol:P2, kind:'mag'}, {sym:'θ', unit:'°', tol:A1, kind:'dir'}];

/* ---------- the 20 problems. gen() must draw the same numbers MyOpenMath does. ---------- */
const CHAPTERS = ['Components', 'Adding two', 'Adding many', 'Subtracting'];
const QS = [
{ch:0, name:'Solve the triangle', kind:'xy', unit:'m',
  gen:() => ({c:rnd(3, 9, .5), th:ri(15, 75)}),
  story:p => `A <b>${p.c} m</b> ladder leans against a wall, making a <b>${p.th}°</b> angle with the level ground. How far from the wall is its foot (<i>a</i>), and how high up the wall does it reach (<i>b</i>)?`,
  parts:() => [{sym:'a', unit:'m', tol:P2, kind:'x'}, {sym:'b', unit:'m', tol:P2, kind:'y'}],
  given:p => [{label:'ladder', m:p.c, d:p.th}], chain:() => [],
  target:p => pol(p.c, p.th),
  steps:p => [`Adjacent side (CAH): <span class="m">a = c cos θ = ${p.c} cos ${p.th}° = ${f(p.c * Math.cos(p.th * D2R))} m</span>`, `Opposite side (SOH): <span class="m">b = c sin θ = ${p.c} sin ${p.th}° = ${f(p.c * Math.sin(p.th * D2R))} m</span>`, `Check with Pythagoras: <span class="m">a² + b² = ${f(p.c * p.c)} = c²</span>`]},
{ch:0, name:'The ramp', kind:'polar', unit:'m', noDir:true,
  gen:() => ({a:rnd(2, 8, .5), b:rnd(1, 4, .5)}),
  story:p => `A ramp rises <b>${p.b} m</b> over a horizontal run of <b>${p.a} m</b>. How long is the ramp's surface (<i>r</i>), and what angle <i>θ</i> does it make with the ground?`,
  parts:() => [{sym:'r', unit:'m', tol:P2, kind:'mag'}, {sym:'θ', unit:'°', tol:P2, kind:'dir'}],
  given:p => [{label:'run', m:p.a, d:0, html:'run'}, {label:'rise', m:p.b, d:90, html:'rise'}], pre:true,
  steps:p => [`Pythagorean theorem: <span class="m">r = √(${p.a}² + ${p.b}²) = ${f(Math.hypot(p.a, p.b))} m</span>`, `TOA: <span class="m">θ = tan⁻¹(${p.b}/${p.a}) = ${fd(Math.atan(p.b / p.a) / D2R)}</span>`]},
{ch:0, name:'Components of a force', kind:'xy', unit:'N',
  gen:() => ({F:rnd(50, 500, 10), th:until(() => ri(10, 350), t => (t > 8 && t < 82) || (t > 98 && t < 172) || (t > 188 && t < 262) || (t > 278 && t < 352))}),
  story:p => `A rope pulls a sled with a force of <b>${p.F} N at ${p.th}°</b>, measured counterclockwise from the +x axis. Find the x and y components of the force.`,
  parts:p => [{sym:'F<sub>x</sub>', unit:'N', tol:{abs:.015 * p.F}, kind:'x'}, {sym:'F<sub>y</sub>', unit:'N', tol:{abs:.015 * p.F}, kind:'y'}],
  given:p => [{label:'F', m:p.F, d:p.th}], chain:() => [], target:p => pol(p.F, p.th),
  steps:p => [`Use the actual angle, which gives the signs automatically: <span class="m">F<sub>x</sub> = ${p.F} cos ${p.th}° = ${f(p.F * Math.cos(p.th * D2R))} N</span>`, `<span class="m">F<sub>y</sub> = ${p.F} sin ${p.th}° = ${f(p.F * Math.sin(p.th * D2R))} N</span>`]},
{ch:0, name:'Unit vector', kind:'xy', unit:'',
  gen:() => ({Cx:until(() => ri(-9, 9), x => Math.abs(x) >= 2), Cy:until(() => ri(-9, 9), x => Math.abs(x) >= 2)}),
  story:p => `Vector <b>C = ${comp(p.Cx, p.Cy)} m</b>. Find the x and y components of the unit vector <b>Ĉ</b>, which points the same way as C but has length 1.`,
  parts:() => [{sym:'Ĉ<sub>x</sub>', unit:'', tol:{abs:.015}, kind:'x'}, {sym:'Ĉ<sub>y</sub>', unit:'', tol:{abs:.015}, kind:'y'}],
  given:p => [{label:'C', v:[p.Cx, p.Cy]}], chain:() => [], target:p => { const m = Math.hypot(p.Cx, p.Cy); return [p.Cx / m, p.Cy / m]; },
  steps:p => { const m = Math.hypot(p.Cx, p.Cy); return [`Length of C: <span class="m">|C| = √(${p.Cx}² + ${p.Cy}²) = ${f(m)} m</span>`, `Divide each component by |C|: <span class="m">Ĉ = C/|C| = ${f(p.Cx / m)} î ${p.Cy < 0 ? '−' : '+'} ${f(Math.abs(p.Cy / m))} ĵ</span>`]; }},
{ch:0, name:'Scaling a vector', kind:'polar', unit:'m',
  gen:() => ({k:pick([-3, -2, -1.5, -0.5, 0.5, 1.5, 2, 2.5, 3]), B:ri(2, 10), th:until(() => ri(10, 350), t => Math.abs(t - 180) > 3)}),
  story:p => `Displacement <b>B</b> is <b>${p.B} m at ${p.th}°</b>. Find the magnitude and direction of <b>${minus(p.k)}B</b>.`,
  parts:() => polarParts('|kB|', 'm'),
  given:p => [{label:'B', m:p.B, d:p.th}], chain:() => [], target:p => { const v = pol(p.B, p.th); return [p.k * v[0], p.k * v[1]]; },
  steps:p => [`Magnitude: <span class="m">|${minus(p.k)}| × ${p.B} = ${f(Math.abs(p.k) * p.B)} m</span>`, p.k > 0 ? `A positive multiplier keeps the direction: <span class="m">θ = ${p.th}°</span>` : `A negative multiplier reverses the direction: <span class="m">θ = ${p.th}° ${p.th < 180 ? '+' : '−'} 180° = ${p.th < 180 ? p.th + 180 : p.th - 180}°</span>`]},
{ch:0, name:'Components to polar', kind:'polar', unit:'m',
  gen:() => ({Ax:until(() => ri(-12, 12), x => Math.abs(x) >= 2), Ay:until(() => ri(-12, 12), x => Math.abs(x) >= 2)}),
  story:p => `A drone's displacement is <b>A = ${comp(p.Ax, p.Ay)} m</b>. Find the magnitude and direction of A.`,
  parts:() => polarParts('A', 'm'),
  given:p => [{label:'Aₓ î', v:[p.Ax, 0], html:'A<sub>x</sub> î'}, {label:'A_y ĵ', v:[0, p.Ay], html:'A<sub>y</sub> ĵ'}], pre:true,
  steps:p => polarSteps([], [p.Ax, p.Ay], 'm', 'A')},

{ch:1, name:'Two ropes on a box', kind:'polar', unit:'N',
  gen:() => { const a1 = ri(10, 60); return {F1:ri(5, 30), a1, F2:ri(5, 30), a2:a1 + ri(60, 120)}; },
  story:p => `Two ropes pull on a box: <b>F₁ = ${p.F1} N at ${p.a1}°</b> and <b>F₂ = ${p.F2} N at ${p.a2}°</b>. Find the magnitude and direction of the net force.`,
  parts:() => polarParts('F<sub>net</sub>', 'N'), R:'F<sub>net</sub>',
  given:p => [{label:'F₁', html:'F₁', m:p.F1, d:p.a1}, {label:'F₂', html:'F₂', m:p.F2, d:p.a2}]},
{ch:1, name:'Running on the train', kind:'polar', unit:'m/s',
  gen:() => ({vt:ri(5, 30), vp:rnd(2, 8, .5), dp:pick([90, 270])}),
  story:p => `A train moves <b>west at ${p.vt} m/s</b>. A passenger runs <b>${p.dp === 90 ? 'north' : 'south'} at ${p.vp} m/s</b> relative to the train. Find the passenger's velocity relative to the ground.`,
  parts:() => polarParts('v<sub>pg</sub>', 'm/s'), R:'v<sub>pg</sub>',
  given:p => [{label:'v train', html:'v<sub>tg</sub>', m:p.vt, d:180}, {label:'v run', html:'v<sub>pt</sub>', m:p.vp, d:p.dp}]},
{ch:1, name:'Crossing the river', kind:'polar', unit:'m/s',
  gen:() => ({vb:rnd(2, 6, .5), vc:rnd(.5, 3, .5), dc:pick([0, 180])}),
  story:p => `A kayak paddles <b>due north at ${p.vb} m/s</b> relative to the water. The river flows <b>${p.dc === 0 ? 'east' : 'west'} at ${p.vc} m/s</b>. Find the kayak's velocity relative to the shore.`,
  parts:() => polarParts('v', 'm/s'), R:'v',
  given:p => [{label:'v kayak', html:'v<sub>kayak</sub>', m:p.vb, d:90}, {label:'v river', html:'v<sub>river</sub>', m:p.vc, d:p.dc}]},
{ch:1, name:'Two-leg hike', kind:'polar', unit:'m',
  gen:() => ({d1:ri(200, 900), t1:ri(10, 80), d2:ri(200, 900), t2:ri(10, 80)}),
  story:p => `A hiker walks <b>${p.d1} m at ${p.t1}° N of E</b>, then <b>${p.d2} m at ${p.t2}° N of W</b>. Find the hiker's total displacement.`,
  parts:() => polarParts('d', 'm'), R:'d',
  given:p => [{label:'d₁', html:'d₁', m:p.d1, d:p.t1}, {label:'d₂', html:'d₂', m:p.d2, d:180 - p.t2}]},
{ch:1, name:'Plane in a crosswind', kind:'polar', unit:'km/h',
  gen:() => { const vp = ri(300, 600), a = ri(20, 160), w = ri(30, 120); return {vp, a, w, aw:until(() => ri(0, 359), aw => vp * Math.sin(a * D2R) + w * Math.sin(aw * D2R) > .05 * (vp + w))}; },
  story:p => `An airplane flies at <b>${p.vp} km/h at ${p.a}°</b> relative to the air. The wind blows at <b>${p.w} km/h toward ${p.aw}°</b>. Find the plane's velocity relative to the ground.`,
  parts:() => polarParts('v<sub>ground</sub>', 'km/h'), R:'v',
  given:p => [{label:'v air', html:'v<sub>air</sub>', m:p.vp, d:p.a}, {label:'wind', html:'v<sub>wind</sub>', m:p.w, d:p.aw}]},

{ch:2, name:'Three forces: components', kind:'xy', unit:'N',
  gen:() => ({F1:rnd(50, 150, 10), a1:ri(20, 70), F2:rnd(150, 250, 10), a2:ri(110, 160), F3:rnd(20, 60, 10)}),
  story:p => `Three forces act on a crate: <b>F₁ = ${p.F1} N at ${p.a1}°</b>, <b>F₂ = ${p.F2} N at ${p.a2}°</b>, and <b>F₃ = ${p.F3} N at 270°</b>. Find the x and y components of the net force.`,
  parts:p => { const t = .005 * (p.F1 + p.F2 + p.F3); return [{sym:'F<sub>net,x</sub>', unit:'N', tol:{abs:t}, kind:'x'}, {sym:'F<sub>net,y</sub>', unit:'N', tol:{abs:t}, kind:'y'}]; },
  given:p => [{label:'F₁', html:'F₁', m:p.F1, d:p.a1}, {label:'F₂', html:'F₂', m:p.F2, d:p.a2}, {label:'F₃', html:'F₃', m:p.F3, d:270}],
  steps:p => { const it = QS[11].given(p), R = sum(it.map(vecOf)); return polarSteps(it, R, 'N', 'F<sub>net</sub>').slice(0, 4); }},
{ch:2, name:'Three forces: net force', kind:'polar', unit:'N',
  gen:() => ({F1:rnd(50, 150, 10), a1:ri(20, 70), F2:rnd(150, 250, 10), a2:ri(110, 160), F3:rnd(20, 60, 10)}),
  story:p => `Three forces act on a crate: <b>F₁ = ${p.F1} N at ${p.a1}°</b>, <b>F₂ = ${p.F2} N at ${p.a2}°</b>, and <b>F₃ = ${p.F3} N at 270°</b>. Find the magnitude and direction of the net force.`,
  parts:() => polarParts('F<sub>net</sub>', 'N'), R:'F<sub>net</sub>',

const CODES = QS.map((q, i) => { const n = i - QS.findIndex(x => x.ch === q.ch) + 1; return `${q.ch + 1}.${n}`; });

/* ---------- link settings: ?q=1.1..4.5 (or level=) & the numbers & mode=test|show|solution & launch=a,b ---------- */
const URLQ = new URLSearchParams(location.search);
const LINK = (() => {
  const raw = (URLQ.get('q') || URLQ.get('level') || '').trim(); if (!raw) return null;
  let i = CODES.indexOf(raw); if (i < 0 && /^\d+$/.test(raw)) i = +raw - 1;
  if (!QS[i]) return null;

})();
const MODE = (URLQ.get('mode') || '').toLowerCase();
const LOCK = !!LINK, TEST = LOCK && MODE === 'test', SHOW = LOCK && MODE === 'show', SOLN = LOCK && MODE === 'solution', BARE = TEST || SHOW || SOLN;
const NOSOL = URLQ.get('solution') === '0';

if (BARE){ document.documentElement.classList.add('bare'); $('app').classList.add('bare'); }

const store = {
  get(k, d){ if (LOCK) return d; try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch (e) { return d; } },

/* ---------- state and drawing ---------- */
const S = {cur:0, p:null, P:0, target:false, answer:false, stu:null, stuT:0, hidden:SHOW, banner:null, msg:'', run:false, tries:0, solved:false, helped:false, phase:'given'};
const cv = $('scene'), ctx = cv.getContext('2d');
let W = 640, H = 400;
const q = () => QS[S.cur];
const stuVec = vals => q().kind === 'polar' ? (q().noDir ? pol(vals[0], vals[1]) : pol(vals[0], vals[1])) : vals.slice();

function view(){
  const Q = q(), p = S.p, pts = [[0, 0]], ch = Q.chain(p);
  for (const it of Q.given(p)){ const a = it.at || [0, 0]; pts.push(a, sum([a, rawOf(it)])); }
  const SC = SCENES[CODES[S.cur]]; if (SC && SC.extent) pts.push(...SC.extent(p));
  let acc = [0, 0]; for (const it of ch){ acc = sum([acc, vecOf(it)]); pts.push(acc.slice()); }

  if (Q.pre){ let a = [0, 0]; for (const it of Q.given(p)){ a = sum([a, vecOf(it)]); pts.push(a.slice()); } }
  if (S.stu){ const v = stuVec(S.stu); pts.push(v, [v[0], 0]); }

  const sc = Math.min((W - left - right) / (x1 - x0), (H - top - bot) / (y1 - y0));
  const ox = left + ((W - left - right) - (x1 - x0) * sc) / 2 - x0 * sc, oy = top + ((H - top - bot) - (y1 - y0) * sc) / 2 + y1 * sc;

/* ---------- scenery: drawn under the vectors, in the same world units ---------- */
function props(V){
  const X = V.X, Y = V.Y, px = n => n * V.sc;
  const ln = (a, b, c, w = 2, dash) => { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(b[0]), Y(b[1])); ctx.stroke(); ctx.restore(); };
  const D = {X, Y, px, ln,
    // an angle mark at c from direction a0 to a1 (degrees counterclockwise from +x)
    arc(c, r, a0, a1, text, color = '#ffd25e', alpha = 1){
      if (alpha <= .02) return;
      const x = X(c[0]), y = Y(c[1]); ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, -a0 * D2R, -a1 * D2R, a1 > a0); ctx.stroke();
      const m = (a0 + a1) / 2 * D2R; if (text) label(text, x + (r + 18) * Math.cos(m), y - (r + 18) * Math.sin(m) + 5, color, 12);

    // a reference line for an angle, e.g. the −x axis for "N of W"

    ground(y, x0, x1, c = '#9aa7b4'){

      ctx.lineWidth = 1.2; for (let x = a + 4; x < b; x += 10){ ctx.beginPath(); ctx.moveTo(x, sy + 2); ctx.lineTo(x - 7, sy + 12); ctx.stroke(); }
    },
    wall(x, y0, y1, side = 1){

      ctx.strokeStyle = '#c3ccd5'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx, a); ctx.lineTo(sx, b); ctx.stroke();

    poly(pts, fill, stroke){ ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(X(q[0]), Y(q[1])) : ctx.moveTo(X(q[0]), Y(q[1]))); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } },
    ladder(a, b){

    ring(c){ ctx.strokeStyle = '#c3ccd5'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(X(c[0]), Y(c[1]), 11, 0, 7); ctx.stroke(); ctx.strokeStyle = '#59636e'; ctx.lineWidth = 1.5; ctx.stroke(); },
    flag(c, color = '#ff6a1f', text){ const x = X(c[0]), y = Y(c[1]); ctx.strokeStyle = '#dfe6ec'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 30); ctx.stroke(); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y - 30); ctx.lineTo(x + 18, y - 24); ctx.lineTo(x, y - 18); ctx.fill(); if (text) label(text, x, y + 18, '#dfe6ec', 11); },
    compass(){ const x = 36, y = 112; ctx.strokeStyle = '#a9b6c2'; ctx.fillStyle = '#a9b6c2'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.closePath(); ctx.fill(); ctx.font = '700 11px "IBM Plex Mono", Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillText('N', x, y - 22); ctx.fillText('E', x + 26, y + 4); ctx.fillText('W', x - 26, y + 4); ctx.fillText('S', x, y + 31); },

    helipad(c){ const x = X(c[0]), y = Y(c[1]); ctx.fillStyle = 'rgba(255,210,94,.18)'; ctx.strokeStyle = '#ffd25e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ffd25e'; ctx.font = '700 15px "IBM Plex Mono", Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillText('H', x, y + 5); },

    // something long drawn along a heading, centered at c: train, kayak, sled or plane
    body(c, deg, kind){

async function playSolution(){
  if (S.run) return; S.run = true; S.phase = 'target';
  await targetRun(); S.answer = true; paint();
  S.phase = 'done'; S.run = false; paint();
}

function resize(){
  const box = $('range'), wide = innerWidth > 900 && !BARE;
  const aw = box.clientWidth, nW = Math.floor(aw), nH = Math.floor(wide ? Math.min(box.clientHeight, aw * .72) : aw * .62), dpr = devicePixelRatio || 1;
  if (nW === W && nH === H && cv.width === Math.round(W * dpr)) return;
  W = nW; H = nH; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.p) paint();
}
new ResizeObserver(resize).observe($('range'));
addEventListener('resize', resize);

function start(){
  resize();
  if (LINK){ S.p = LINK.p; loadQ(LINK.i, false); }
  else { const cur = store.get('vector-range-cur', 0); loadQ(QS[cur] ? cur : 0); }
  if (SHOW){ cv.addEventListener('click', playShow); setTimeout(playShow, 900); }
  if (SOLN){ cv.addEventListener('click', playSolution); setTimeout(playSolution, 700); }
  if (document.fonts?.ready) document.fonts.ready.then(paint);
}
start();
})();
</script>
</body>
</html>
