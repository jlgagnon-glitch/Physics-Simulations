<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physics Proving Ground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a live view of the outdoor test site on the left, the control desk (mission, input, debrief) on the right. One deliberate look. */
:root{
  --paper:#18212b; --sheet:#222e3b; --rule:#3d4d5e;
  --ink:#eaf0f4; --muted:#a9b6c2; --steel-lt:#6d7d8c;
  --safety:#ff8a2a; --hit:#7dffc1; --miss:#ff8b7a; --field:#0f161e; --on-safety:#20140a;
  --f-display:"Saira Stencil One", Impact, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}   /* hidden panels must never cover the range */
table{color:inherit; font-size:inherit; font-weight:inherit; font-style:inherit; line-height:inherit}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--safety); outline-offset:2px}

.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); grid-template-columns:minmax(0,1fr) 370px; gap:10px 16px;
  padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px}
h1{margin:0; font-family:var(--f-display); font-weight:400; font-size:30px; line-height:1; color:var(--ink); letter-spacing:.02em}
.nav{display:flex; flex-wrap:wrap; gap:6px 14px; flex:1; min-width:0}
.group{display:flex; align-items:center; gap:3px}
.group > span{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-right:3px}
.lv{min-width:34px; height:34px; border:1px solid var(--rule); background:var(--sheet); border-radius:3px; cursor:pointer; font-family:var(--f-mono); font-size:14px; font-weight:600; position:relative; padding:0}
.lv.cur{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.lv.done{border-color:var(--hit); box-shadow:inset 0 -3px 0 var(--hit)}
.lv.cur.done{box-shadow:inset 0 -3px 0 #0f7a4d}
.lv.helped{box-shadow:inset 0 -3px 0 var(--steel-lt)}
.total{font-family:var(--f-mono); font-size:14px; font-weight:600; white-space:nowrap}

.range{min-width:0; min-height:0; display:flex; align-items:flex-start; justify-content:center}
#scene{display:block; border:1px solid var(--rule); border-radius:4px; background:var(--field); max-width:100%}
.test{min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:6px}
.sheet{background:var(--sheet); border:1px solid var(--rule); padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.tag{font-family:var(--f-mono); font-size:13px; font-weight:600; color:var(--safety)}
h2{margin:0; font-size:20px; line-height:1.2; text-wrap:balance}
.story{margin:0}
.story b{font-family:var(--f-mono); font-weight:600}
.entry{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.entry label{font-family:var(--f-mono); font-weight:600}
.btn.sign{min-width:44px; min-height:44px; padding:0 10px; font-size:20px; line-height:1}   /* phone and tablet number pads have no minus key */
#ans{width:7.5em; font-family:var(--f-mono); font-weight:600; font-size:18px; padding:7px 8px; background:var(--field); border:2px solid var(--safety); border-radius:2px; color:var(--ink)}
.btn{border:1px solid var(--ink); background:transparent; padding:9px 13px; font-weight:700; cursor:pointer; border-radius:2px}
.btn.go{background:var(--safety); border-color:var(--safety); color:var(--on-safety)}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:8px}
.err{margin:0; color:var(--miss); font-weight:700; font-size:15px}
.note{margin:0; font-size:14.5px; color:var(--muted)}
.eqs{margin:0; padding:0; list-style:none; font-family:var(--f-mono); font-size:14.5px; display:flex; flex-direction:column; gap:2px}
.label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.result{font-weight:700; font-size:17px; margin:0}
.result.hit{color:var(--hit)} .result.miss{color:var(--miss)}
.facts{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:3px; font-size:15px}
.steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:15px}
.steps .m{font-family:var(--f-mono); font-size:14.5px}

/* One level with fixed numbers (opened from a link): no level menu or star count. */
.app.locked .nav, .app.locked .total{display:none}
.app.locked h1{font-size:22px}
/* Test mode: only the picture of the setup, no answer entry or feedback. */
html.bare, html.bare body{height:auto}
.app.bare{height:auto; grid-template-columns:minmax(0,1fr); grid-template-rows:auto}
.app.bare header, .app.bare .test{display:none}
.app.bare .range{display:block}

@media (max-width:900px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr); grid-template-rows:none; height:auto}
  .test{overflow:visible}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <h1>Physics Proving Ground</h1>
    <nav class="nav" id="nav" aria-label="Levels"></nav>
    <div class="total" id="total"></div>
  </header>
  <section class="range" id="range"><canvas id="scene" role="img" aria-label="Side view of the test range"></canvas></section>
  <aside class="test" id="test">
    <section class="sheet">
      <div class="tag" id="tag"></div>
      <h2 id="lvName"></h2>
      <p class="story" id="story"></p>
      <form class="entry" id="form" autocomplete="off">
        <label for="ans" id="ansLabel"></label>
        <input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-describedby="errMsg">
        <button class="btn sign" id="btnSign" type="button" aria-label="Change the sign of the answer" hidden>±</button>
        <button class="btn go" id="btnGo" type="submit">Launch</button>
      </form>
      <p class="err" id="errMsg" hidden></p>
      <p class="note">Calculate your answer, then launch. Use g = 9.8 m/s² and keep three significant figures. Ghost images mark equal time steps, so wider gaps mean faster motion.</p>
    </section>
    <section class="sheet">
      <div class="label">Useful equations</div>
      <ul class="eqs" id="eqs"></ul>
    </section>
    <section class="sheet" id="debrief" hidden>
      <p class="result" id="resultLine"></p>
      <div id="factsBox"><div class="label">What your launch did</div><ul class="facts" id="facts"></ul></div>
      <div id="ideaBox"><div class="label">The physics</div><p class="story" id="idea"></p></div>
      <div id="stepsBox" hidden><div class="label">Worked solution</div><ol class="steps" id="steps"></ol></div>
      <div class="row">
        <button class="btn" id="btnSolve" type="button">Show worked solution</button>
        <button class="btn" id="btnFresh" type="button">New numbers</button>
        <button class="btn go" id="btnNext" type="button" hidden>Next level</button>
      </div>
    </section>
  </aside>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const g = 9.8, RAD = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;   // only turns off decorative effects: the physics motion always plays
const INSTANT = new URLSearchParams(location.search).get('instant') === '1';   // jump to the end of each run (used by automated tests)
const rnd = (a, b, s) => { const n = Math.round((b - a) / s); return +(a + s * Math.floor(Math.random() * (n + 1))).toFixed(4); };
const pick = a => a[Math.floor(Math.random() * a.length)];
const f = x => { if (!isFinite(x)) return '∞'; const a = Math.abs(x); return a >= 100 ? x.toFixed(0) : a >= 10 ? x.toFixed(1) : a >= 1 ? x.toFixed(2) : x.toFixed(3); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fallTime = H => Math.sqrt(2 * H / g);
const shortLong = (got, want, unit) => `${f(Math.abs(got - want))} ${unit} ${got < want ? 'short' : 'too far'}`;
const within = (got, want, frac) => Math.abs(got - want) <= frac * want;
// Point s along a track that runs flat, then bends up a hill at x = xr: [x, y, tilt]. The tilt eases in as the wheels cross the bend.
const hillAt = (xr, s, deg) => { const a = deg * RAD; return s <= 0 ? [xr + s, 0, 0] : [xr + s * Math.cos(a), s * Math.sin(a), a * clamp(s / .2, 0, 1)]; };

/* ---------- the levels. sim() must also work with v = 0, which draws the setup before a launch. ---------- */
let HIDE = false;   // true while showing the correct launch to a student who has not answered yet: no answer values anywhere
const CHAPTERS = ['Motion', 'Forces', 'Energy', 'Rotation'];
const LEVELS = [
{ch:0, name:'Off the bench', sym:'v', unit:'m/s', word:'launch speed',
  story:p => `A pusher starts a ball from rest and rolls it along a bench <b>${p.h} m</b> high, letting go at the edge. The landing pad is <b>${p.d} m</b> from the edge. What speed must the ball leave the bench with?`,
  eqs:['y = ½gt²', 'x = v·t'], idea:'Horizontal and vertical motion are independent. The height alone sets the fall time, and the speed then sets how far the ball goes in that time.',
  gen:() => ({h:rnd(.8, 1.6, .1), d:rnd(1.5, 3.5, .1)}), ans:p => p.d * Math.sqrt(g / (2 * p.h)), view:p => [-2.8, p.d * 1.45, p.h * 1.5],
  sim(p, v){ const t0 = fallTime(p.h), land = v * t0, hit = within(land, p.d, .03), run = 2, push = v * v / (2 * run), T0 = v > 0 ? 2 * run / v : 0;   // pushed from rest over the run, reaching v at the edge
    return {T:Math.min(T0 + t0, 8), hit, miss:`The ball landed ${shortLong(land, p.d, 'm')}.`, facts:[`Fall time: ${f(t0)} s, which your speed cannot change`, `Distance: ${f(v)} m/s × ${f(t0)} s = ${f(land)} m`],
      draw(t, D){ D.bench(-2.8, 0, p.h); D.pad(p.d, .03 * p.d); D.dim(0, p.d, -.14 * p.h, `${p.d} m`); D.vdim(-.25, 0, p.h, `${p.h} m`);
        const onBench = t < T0 || !v, fall = Math.max(0, t - T0), x = onBench ? -run + .5 * push * t * t : v * fall, y = p.h - .5 * g * fall * fall, sp = onBench ? push * t : v;
        D.pusher(-2.6, Math.min(x, 0), p.h); D.ball(x, y, 0, '', onBench ? x + run : run + x); D.vel(x, y, sp, -g * fall);
        return onBench ? ['rolling on the bench', `x ${f(x)} m`, `v ${f(sp)} m/s`] : [`fall time ${f(fall)} s`, `x ${f(x)} m`, `vy ${f(g * fall)} m/s`]; }}; },
  steps:(p, a) => [`Fall time from the height: <span class="m">t = √(2h/g) = √(2·${p.h}/9.8) = ${f(fallTime(p.h))} s</span>`, `Speed to cover the distance in that time: <span class="m">v = d/t = ${p.d}/${f(fallTime(p.h))} = ${f(a)} m/s</span>`]},

{ch:0, name:'Stop on the line', sym:'a', unit:'m/s²', word:'acceleration', signed:true,
  story:p => `A test cart reaches the brake zone moving right at <b>${p.v} m/s</b>. It has to stop <b>${p.d} m</b> later, right on the line. What is its acceleration while it brakes? Take right as positive.`,
  eqs:['v² = v₀² + 2a·Δx'], idea:'With no time given, use the equation without t. The final speed is zero. The cart slows down while moving in the positive direction, so its acceleration points the other way and is negative.',
  gen:() => ({v:rnd(8, 20, 1), d:rnd(12, 40, 1)}), ans:p => -p.v * p.v / (2 * p.d), view:p => [-3, p.d * 1.4, p.d * .35],
  sim(p, a){ const b = -a, s = b > 0 ? p.v * p.v / (2 * b) : Infinity, Tstop = b > 0 ? p.v / b : Infinity, T = Math.min(Tstop, b > 0 ? 6 : 2.5), hit = within(s, p.d, .03);
    return {T, hit, miss:isFinite(s) ? `The cart stopped ${shortLong(s, p.d, 'm')}.` : a > 0 ? 'A positive acceleration points the same way as the velocity, so the cart sped up and never stopped. Braking needs an acceleration opposite the motion.' : 'With zero acceleration, the cart never stops.',
      facts:isFinite(s) ? [`Stopping distance: Δx = −v₀²/(2a) = −${p.v}² / (2 × (${f(a)})) = ${f(s)} m`, `Stopping time: ${f(Tstop)} s`] : a > 0 ? [`The speed grew by ${f(a)} m/s every second`, 'A negative acceleration is needed to slow a cart moving in the positive direction'] : ['Zero acceleration leaves the speed constant.'],
      draw(t, D){ D.ground(); D.pad(p.d, .03 * p.d); D.dim(0, p.d, -p.d * .05, `${p.d} m`);
        const x = p.v * t + .5 * a * t * t, sp = p.v + a * t; D.cart(x, .012 * p.d); D.vel(x, p.d * .05, sp, 0); return [`t ${f(t)} s`, `x ${f(x)} m`, `v ${f(sp)} m/s`]; }}; },
  steps:(p, a) => [`Final speed is zero: <span class="m">0 = v₀² + 2a·Δx</span>`, `Solve for a: <span class="m">a = −v₀²/(2Δx) = −${p.v}²/(2·${p.d}) = ${f(a)} m/s²</span>`, `The negative sign means the acceleration points left, opposite the cart's motion.`]},

{ch:0, name:'Fixed angle', sym:'v', unit:'m/s', word:'launch speed',
  story:p => `A launcher is locked at <b>${p.th}°</b> above level ground. The target is <b>${p.R} m</b> away at launcher height. What launch speed reaches it?`,
  eqs:['R = v²·sin(2θ) / g', 'vₓ = v cos θ', 'v_y = v sin θ'], idea:'Over level ground the range depends on the square of the speed, so doubling the speed gives four times the range.',
  gen:() => ({th:pick([30, 40, 50, 60]), R:rnd(8, 20, 1)}), ans:p => Math.sqrt(p.R * g / Math.sin(2 * p.th * RAD)), view:p => [-1.5, p.R * 1.35, p.R * .62],
  sim(p, v){ const c = Math.cos(p.th * RAD), s = Math.sin(p.th * RAD), T = 2 * v * s / g, R = v * c * T, hit = within(R, p.R, .03);
    return {T, hit, miss:`The shot landed ${shortLong(R, p.R, 'm')}.`, facts:[`Flight time: ${f(T)} s`, `Horizontal speed: ${f(v * c)} m/s, constant the whole way`, `Range: ${f(R)} m`],
      draw(t, D){ D.ground(); D.pad(p.R, .03 * p.R); D.dim(0, p.R, -p.R * .045, `${p.R} m`); D.launcher(0, 0, p.th, `${p.th}°`);
        const vy = v * s - g * t, x = v * c * t, y = v * s * t - .5 * g * t * t; D.trace(tt => [v * c * tt, v * s * tt - .5 * g * tt * tt], t); D.ball(x, y); D.vel(x, y, v * c, vy); return [`t ${f(t)} s`, `x ${f(x)} m`, `y ${f(y)} m`]; }}; },
  steps:(p, a) => [`Range equation: <span class="m">R = v²·sin(2θ)/g</span>`, `Solve for v: <span class="m">v = √(Rg / sin 2θ) = √(${p.R}·9.8 / sin ${2 * p.th}°) = ${f(a)} m/s</span>`]},

{ch:0, name:'Lead the cart', sym:'t', unit:'s', word:'release delay',
  story:p => `A cart rolls right at <b>${p.u} m/s</b>, starting <b>${p.x0} m</b> left of a tower's base. From the top of the tower, <b>${p.h} m</b> up, a ball is launched to the right at <b>${p.v} m/s</b>. How long after the cart starts should you release the ball so it lands in the cart?`,
  eqs:['t_fall = √(2h/g)', 'x_land = v·t_fall', 'x_cart = x₀ + u·t'], idea:'Both have to reach the same place at the same time. Find where the ball lands and how long the fall takes, then work out when the cart gets there.',
  gen(){ for (;;){ const p = {u:rnd(1.5, 3, .5), x0:rnd(5, 10, 1), v:rnd(1, 3, .5), h:rnd(3, 6, 1)}; if (this.ans(p) > .8) return p; } },
  ans:p => (p.x0 + p.v * fallTime(p.h)) / p.u - fallTime(p.h), view:p => [-p.x0 - 1, p.v * fallTime(p.h) + 3, p.h * 1.3],
  sim(p, d){ const tf = fallTime(p.h), land = p.v * tf, T = d + tf, cart = t => -p.x0 + p.u * t, gap = cart(T) - land, hit = Math.abs(gap) <= .3;
    return {T:Math.min(T, 8), hit, miss:`The ball landed with the cart ${f(Math.abs(gap))} m ${gap < 0 ? 'short of' : 'past'} the spot.`, facts:[`The ball lands ${f(land)} m out after falling for ${f(tf)} s`, `It lands at t = ${f(d)} + ${f(tf)} = ${f(T)} s`, `The cart is then at ${f(cart(T))} m`],
      draw(t, D){ D.ground(); D.cart(cart(t), .4); D.tower(0, p.h); D.dim(-p.x0, 0, -p.h * .07, `${p.x0} m`);
        const ft = t - d; if (ft < 0){ D.ball(0, p.h); } else { const q = Math.min(ft, tf), x = p.v * q, y = p.h - .5 * g * q * q; D.ball(x, y); D.vel(x, y, p.v, -g * q); }
        return [`t ${f(t)} s`, `cart ${f(cart(t))} m`, ft < 0 ? 'ball held' : 'ball away']; }}; },
  steps:(p, a) => { const tf = fallTime(p.h), L = p.v * tf; return [`Fall time: <span class="m">t = √(2·${p.h}/9.8) = ${f(tf)} s</span>`, `Landing spot: <span class="m">x = ${p.v}·${f(tf)} = ${f(L)} m</span>`, `Cart's time to reach it: <span class="m">(${p.x0} + ${f(L)})/${p.u} = ${f(a + tf)} s</span>`, `Release delay: <span class="m">${f(a + tf)} − ${f(tf)} = ${f(a)} s</span>`]; }},

{ch:1, name:'Skid to the mark', sym:'v', unit:'m/s', word:'launch speed',
  story:p => `A sled slides across a floor with friction coefficient <b>μ = ${p.mu}</b>. It has to stop <b>${p.d} m</b> from the start. What speed should it begin with?`,
  eqs:['f = μN = μmg', 'a = F / m', 'v² = v₀² + 2a·Δx'], idea:'Friction is the net force, and the mass cancels: a = μg. A heavier sled feels more friction but has more inertia, so it stops in the same distance.',
  gen:() => ({mu:rnd(.15, .5, .05), d:rnd(4, 15, 1)}), ans:p => Math.sqrt(2 * p.mu * g * p.d), view:p => [-1.5, p.d * 1.4, p.d * .35],
  sim(p, v){ const a = p.mu * g, s = v * v / (2 * a), T = v / a, hit = within(s, p.d, .03);
    return {T, hit, miss:`The sled stopped ${shortLong(s, p.d, 'm')}.`, facts:[`Friction slows it at μg = ${f(a)} m/s²`, `Stopping distance: ${f(s)} m in ${f(T)} s`],
      draw(t, D){ D.ground(); D.pad(p.d, .03 * p.d); D.dim(0, p.d, -p.d * .05, `${p.d} m`);
        const x = v * t - .5 * a * t * t, sp = v - a * t; D.block(x, 0, p.d * .07, p.d * .04); D.vel(x, p.d * .07, sp, 0); D.force(x, p.d * .02, 0, 1, 'N', 46); D.force(x, p.d * .02, 0, -1, 'mg', 46); if (sp > .01) D.force(x - p.d * .035, p.d * .01, -1, 0, 'f', 46 * p.mu); return [`t ${f(t)} s`, `x ${f(x)} m`, `v ${f(sp)} m/s`]; }}; },
  steps:(p, a) => [`Net force is friction: <span class="m">μmg = ma, so a = μg = ${f(p.mu * g)} m/s²</span>`, `Stops at the mark: <span class="m">v² = 2ad</span>`, `<span class="m">v = √(2·${f(p.mu * g)}·${p.d}) = ${f(a)} m/s</span>`]},

{ch:1, name:'Steady up the ramp', sym:'F', unit:'N', word:'rope force',
  story:p => `A <b>${p.m} kg</b> crate enters a <b>${p.th}°</b> ramp at <b>${p.v0} m/s</b>. The ramp has friction coefficient <b>μ = ${p.mu}</b>. What rope force, parallel to the ramp, keeps the crate moving at constant speed all the way up?`,
  eqs:['Weight along ramp = mg sin θ', 'N = mg cos θ', 'f = μN', 'ΣF = ma'], idea:'Constant speed means zero acceleration, so the forces along the ramp must balance. The rope has to match the pull of gravity along the ramp plus friction.',
  gen:() => ({m:rnd(10, 40, 5), th:pick([15, 20, 25, 30, 35]), mu:rnd(.1, .4, .05), v0:rnd(1, 2, .5), L:5}), ans:p => p.m * g * (Math.sin(p.th * RAD) + p.mu * Math.cos(p.th * RAD)), view:p => [-.8, 5.7, 3.9],
  sim(p, F){ const s = Math.sin(p.th * RAD), c = Math.cos(p.th * RAD), res = p.m * g * (s + p.mu * c), a = (F - res) / p.m, hit = within(F, res, .02);
    let T = 6, disc = p.v0 * p.v0 + 2 * a * p.L; if (disc >= 0) T = a ? (Math.sqrt(disc) - p.v0) / a : p.L / p.v0; else T = -p.v0 / a;
    const end = p.v0 + a * T;
    return {T, hit, miss:a > 0 ? `The crate sped up to ${f(end)} m/s. Your force was ${f(F - res)} N too big.` : `The crate ${disc < 0 ? 'stalled partway up' : `slowed to ${f(end)} m/s`}. Your force was ${f(res - F)} N too small.`, facts:[`Weight along the ramp: ${f(p.m * g * s)} N`, `Friction: ${f(p.mu * p.m * g * c)} N`, `Net force: ${f(F - res)} N, so a = ${f(a)} m/s²`],
      draw(t, D){ const L = p.L, X = q => q * c, Y = q => q * s; D.ground(); D.slope(0, 0, X(L + .25), Y(L + .25)); D.angle(0, 0, p.th); D.flag(X(L), Y(L));
        const q = p.v0 * t + .5 * a * t * t, sp = p.v0 + a * t, h = .4, cx = X(q) - h / 2 * s, cy = Y(q) + h / 2 * c; D.crate(X(q), Y(q), p.th * RAD, .55, h);
        const px0 = D.x(cx), py0 = D.y(cy); D.forcePx(px0, py0, c, s, 'T', 46 * F / (p.m * g)); D.forcePx(px0, py0, -c, -s, 'f', 46 * p.mu * c); D.forcePx(px0, py0, -s, c, 'N', 46 * c); D.forcePx(px0, py0, 0, -1, 'mg', 46); return [`t ${f(t)} s`, `v ${f(sp)} m/s`, `net ${f(F - res)} N`]; }}; },
  steps:(p, a) => { const s = Math.sin(p.th * RAD), c = Math.cos(p.th * RAD); return [`Zero acceleration: <span class="m">F = mg sin θ + μ mg cos θ</span>`, `Along the ramp: <span class="m">${p.m}·9.8·sin ${p.th}° = ${f(p.m * g * s)} N</span>`, `Friction: <span class="m">${p.mu}·${p.m}·9.8·cos ${p.th}° = ${f(p.mu * p.m * g * c)} N</span>`, `Total: <span class="m">F = ${f(a)} N</span>`]; }},

{ch:1, name:'Hanging counterweight', sym:'M', unit:'kg', word:'hanging mass',
  story:p => `A <b>${p.m} kg</b> cart on a frictionless track is tied over a pulley to a hanging mass. Released from rest, the cart must travel <b>${p.d} m</b> in exactly <b>${p.t} s</b>. What hanging mass does that take?`,
  eqs:['d = ½at²', 'Mg − T = Ma', 'T = ma'], idea:'The hanging weight accelerates both masses, so a = Mg/(M + m). A larger hanging mass helps, but the acceleration can never reach g.',
  gen:() => ({m:rnd(1, 4, .5), d:rnd(1.2, 2, .2), t:rnd(1.2, 2, .2)}), ans:p => { const a = 2 * p.d / (p.t * p.t); return p.m * a / (g - a); }, view:p => [-.6, p.d + 1.3, p.d + 1.3],
  sim(p, M){ const a = M * g / (M + p.m), Tc = a > 0 ? Math.sqrt(2 * p.d / a) : Infinity, hit = within(Tc, p.t, .03), T = Math.min(Tc, 5), gap = Tc - p.t;
    return {T, hit, miss:isFinite(Tc) ? `The cart took ${f(Tc)} s, ${f(Math.abs(gap))} s ${gap > 0 ? 'too slow' : 'too fast'}.` : 'With no hanging mass, nothing pulls the cart.', facts:[`Acceleration: Mg/(M + m) = ${f(a)} m/s²`, `Tension in the string: ${f(p.m * a)} N`, `Time over ${p.d} m: ${f(Tc)} s`],
      draw(t, D){ const y = p.d + .65, ex = p.d + .45, q = Math.min(.5 * a * t * t, p.d); D.bench(-.6, ex, y); D.pad(p.d, .05, y); D.dim(0, p.d, y - .12, `${p.d} m`);
        // the rope leaves the crate at mid-height and runs level to the top of the pulley, then straight down
        const sc = D.y(0) - D.y(1), bh = Math.max(18, sc * .2) / sc, rope = y + bh / 2, r = .09, cx = q, px2 = ex + Math.max(.1, 11 / sc), py = rope - r, hx = px2 + r, hy = y - .25 - q;
        D.string(cx, rope, px2, rope); D.string(hx, py, hx, hy); D.arm(ex, y, px2, py); D.pulley(px2, py, r);
        D.block(cx, y, .34, .2); D.block(hx, hy - bh, .2, .2, M && !HIDE ? `${f(M)} kg` : 'M');
        D.force(cx, rope, 1, 0, 'T'); return [`t ${f(t)} s`, `x ${f(q)} m`, `v ${f(a * t)} m/s`]; }}; },
  steps:(p, A) => { const a = 2 * p.d / (p.t * p.t); return [`Needed acceleration: <span class="m">a = 2d/t² = 2·${p.d}/${p.t}² = ${f(a)} m/s²</span>`, `Forces on both masses: <span class="m">Mg = (M + m)a</span>`, `Solve for M: <span class="m">M = ma/(g − a) = ${p.m}·${f(a)}/(9.8 − ${f(a)}) = ${f(A)} kg</span>`]; }},

{ch:1, name:'Up to the latch', sym:'v', unit:'m/s', word:'launch speed',
  story:p => `A puck is shot up a <b>${p.th}°</b> ramp with friction coefficient <b>μ = ${p.mu}</b>. A latch <b>${p.L} m</b> along the ramp catches it only if it stops right there. What starting speed does it need?`,
  eqs:['a = g(sin θ + μ cos θ)', 'v² = 2a·L'], idea:'Going up, gravity and friction both point down the ramp, so they add. The puck slows faster than it would on a frictionless ramp.',
  gen:() => ({th:pick([15, 20, 25, 30]), mu:rnd(.1, .3, .05), L:rnd(2, 5, 1)}), ans:p => Math.sqrt(2 * g * (Math.sin(p.th * RAD) + p.mu * Math.cos(p.th * RAD)) * p.L), view:p => [-.8, p.L * 1.3, p.L * .75],
  sim(p, v){ const s = Math.sin(p.th * RAD), c = Math.cos(p.th * RAD), a = g * (s + p.mu * c), reach = v * v / (2 * a), T = v / a, hit = within(reach, p.L, .03), R = Math.max(p.L * 1.15, Math.min(reach, p.L * 1.6));
    return {T, hit, miss:`The puck stopped ${shortLong(reach, p.L, 'm')} along the ramp.`, facts:[`Slowing at g(sin θ + μ cos θ) = ${f(a)} m/s²`, `Distance up the ramp: ${f(reach)} m`],
      draw(t, D){ const X = q => q * c, Y = q => q * s; D.ground(); D.slope(0, 0, X(R), Y(R)); D.angle(0, 0, p.th); D.flag(X(p.L), Y(p.L));
        const q = Math.min(v * t - .5 * a * t * t, R), sp = v - a * t, h = .12, bx = X(q) - h / 2 * s, by = Y(q) + h / 2 * c; D.crate(X(q), Y(q), p.th * RAD, .3, h);
        const cx = D.x(bx), cy = D.y(by); D.forcePx(cx, cy, 0, -1, 'mg', 46); D.forcePx(cx, cy, -s, c, 'N', 46 * c); if (sp > .01) D.forcePx(cx, cy, -c, -s, 'f', 46 * p.mu * c); return [`t ${f(t)} s`, `along ${f(q)} m`, `v ${f(sp)} m/s`]; }}; },
  steps:(p, A) => { const a = g * (Math.sin(p.th * RAD) + p.mu * Math.cos(p.th * RAD)); return [`Both forces point down the ramp: <span class="m">a = g(sin ${p.th}° + ${p.mu}·cos ${p.th}°) = ${f(a)} m/s²</span>`, `Speed to stop at L: <span class="m">v = √(2aL) = √(2·${f(a)}·${p.L}) = ${f(A)} m/s</span>`]; }},

{ch:2, name:'Spring to the summit', sym:'x', unit:'m', word:'spring compression',
  story:p => `A <b>${p.m} kg</b> cart sits against a spring with <b>k = ${p.k} N/m</b>. The track is frictionless and climbs to a stop at <b>${p.h} m</b> height. How far should you compress the spring so the cart just reaches that height?`,
  eqs:['PEₛ = ½kx²', 'PE = mgh', 'KE = ½mv²'], idea:'Mechanical energy is conserved. All the spring energy becomes gravitational energy at the top, and the path in between does not matter.',
  gen:() => ({m:rnd(.5, 2, .5), k:rnd(200, 800, 100), h:rnd(.8, 2.2, .2)}), ans:p => Math.sqrt(2 * p.m * g * p.h / p.k), view:p => [-1, 1 + p.h * 2.3, p.h * 1.5],
  sim(p, x){ const v = x * Math.sqrt(p.k / p.m), H = v * v / (2 * g), hit = within(H, p.h, .03), sn = .5, om = Math.sqrt(p.k / p.m), T0 = x > 0 ? Math.PI / 2 / om : 0, T1 = v > 0 ? .85 / v : 0, a = g * sn, T2 = v / a, T = T0 + T1 + T2, R = p.h / sn;
    return {T:Math.min(T, 7), hit, miss:`The cart stopped at ${f(H)} m height, ${shortLong(H, p.h, 'm')}.`, facts:[`Spring energy: ½·${p.k}·${f(x)}² = ${f(.5 * p.k * x * x)} J`, `Speed leaving the spring: ${f(v)} m/s`, `Energy needed at the top: mgh = ${f(p.m * g * p.h)} J`],
      draw(t, D){ const c = Math.cos(30 * RAD), xr = 1, top = Math.max(R * 1.15, 1); D.ground(); D.slope(xr, 0, xr + top * c, top * sn); D.flag(xr + R * c, R * sn); D.wall(-1);
        let e = 0, sp, q;   // e is the free end of the spring; q is distance past the foot of the hill
        if (t < T0){ e = -x * Math.cos(om * t); sp = x * om * Math.sin(om * t); q = e + .15 - xr; } else if (t < T0 + T1 || !x){ sp = v; q = .15 + v * (t - T0) - xr; } else { const u = t - T0 - T1; sp = v - a * u; q = v * u - .5 * a * u * u; }
        D.spring(-1, e, .08); const P = hillAt(xr, q, 30); D.cart(P[0], .2, '', P[1], P[2], q); return [`t ${f(t)} s`, `height ${f(P[1])} m`, `v ${f(sp)} m/s`]; }}; },
  steps:(p, a) => [`Energy conservation: <span class="m">½kx² = mgh</span>`, `Solve for x: <span class="m">x = √(2mgh/k) = √(2·${p.m}·9.8·${p.h}/${p.k}) = ${f(a)} m</span>`]},

{ch:2, name:'Spring meets carpet', sym:'x', unit:'m', word:'spring compression',
  story:p => `A <b>${p.m} kg</b> block is pushed against a spring with <b>k = ${p.k} N/m</b> on a frictionless surface. It then slides onto carpet with <b>μ = ${p.mu}</b> and has to stop <b>${p.d} m</b> into the carpet. How far should you compress the spring?`,
  eqs:['PEₛ = ½kx²', 'Work by friction = μmg·d'], idea:'Friction takes energy out of the system. The block stops once the work done by friction equals the energy the spring stored.',
  gen:() => ({m:rnd(.5, 2, .5), k:rnd(200, 800, 100), mu:rnd(.2, .5, .1), d:rnd(1, 3, .5)}), ans:p => Math.sqrt(2 * p.mu * p.m * g * p.d / p.k), view:p => [-1, p.d * 1.5 + 1, 1.5],
  sim(p, x){ const v = x * Math.sqrt(p.k / p.m), a = p.mu * g, s = v * v / (2 * a), T1 = v > 0 ? .65 / v : 0, T2 = v / a, hit = within(s, p.d, .03), cs = .8, om = Math.sqrt(p.k / p.m), T0 = x > 0 ? Math.PI / 2 / om : 0;
    return {T:T0 + T1 + T2, hit, miss:`The block stopped ${shortLong(s, p.d, 'm')} on the carpet.`, facts:[`Spring energy: ${f(.5 * p.k * x * x)} J`, `Friction force: ${f(p.mu * p.m * g)} N`, `Stopping distance: ${f(.5 * p.k * x * x)} J ÷ ${f(p.mu * p.m * g)} N = ${f(s)} m`],
      draw(t, D){ D.ground(); D.wall(-1); D.carpet(cs, cs + p.d * 1.5); D.pad(cs + p.d, .03 * p.d); D.dim(cs, cs + p.d, -.1, `${p.d} m`);
        let e = 0, q, sp; if (t < T0){ e = -x * Math.cos(om * t); sp = x * om * Math.sin(om * t); q = e + .15; } else if (t < T0 + T1 || !x){ sp = v; q = .15 + v * (t - T0); } else { const u = t - T0 - T1; sp = v - a * u; q = cs + v * u - .5 * a * u * u; } D.spring(-1, e, .1); D.block(q, 0, .3, .2); D.vel(q, .25, sp, 0); return [`t ${f(t)} s`, `x ${f(q)} m`, `v ${f(sp)} m/s`]; }}; },
  steps:(p, a) => [`Spring energy goes into friction work: <span class="m">½kx² = μmg·d</span>`, `Friction work: <span class="m">${p.mu}·${p.m}·9.8·${p.d} = ${f(p.mu * p.m * g * p.d)} J</span>`, `Solve for x: <span class="m">x = √(2·${f(p.mu * p.m * g * p.d)}/${p.k}) = ${f(a)} m</span>`]},

{ch:2, name:'Stick and climb', sym:'v', unit:'m/s', word:'speed of cart A',
  story:p => `Cart A (<b>${p.m1} kg</b>) hits parked cart B (<b>${p.m2} kg</b>) and they lock together. The pair then coasts up a frictionless hill. They must reach exactly <b>${p.h} m</b> height. How fast must cart A go before the crash?`,
  eqs:['m₁v = (m₁ + m₂)v′', '½(m₁ + m₂)v′² = (m₁ + m₂)gh'], idea:'Split this into two stages. Momentum is conserved in the crash, but kinetic energy is not. After the crash, energy is conserved on the hill.',
  gen:() => ({m1:rnd(1, 4, .5), m2:rnd(1, 4, .5), h:rnd(.5, 1.5, .1)}), ans:p => (p.m1 + p.m2) / p.m1 * Math.sqrt(2 * g * p.h), view:p => [-1.5, 1.2 + p.h * 2.5, p.h * 1.5],
  sim(p, v){ const vc = p.m1 * v / (p.m1 + p.m2), H = vc * vc / (2 * g), hit = within(H, p.h, .03), sn = .5, c = Math.cos(30 * RAD), a = g * sn, T1 = v > 0 ? .9 / v : 0, T2 = v > 0 ? 1 / vc : 0, T3 = vc / a, T = T1 + T2 + T3, R = p.h / sn;
    return {T:Math.min(T, 8), hit, miss:`The carts reached ${f(H)} m height, ${shortLong(H, p.h, 'm')}.`, facts:[`Speed after the crash: ${p.m1}·${f(v)}/${f(p.m1 + p.m2)} = ${f(vc)} m/s`, `Kinetic energy lost in the crash: ${f(.5 * p.m1 * v * v - .5 * (p.m1 + p.m2) * vc * vc)} J`, `Height from the remaining energy: ${f(H)} m`],
      draw(t, D){ const xr = 1.2; D.ground(); D.slope(xr, 0, xr + R * 1.15 * c, R * 1.15 * sn); D.flag(xr + R * c, R * sn);
        let sB = .2 - xr, sA = -1 - xr; if (t < T1) sA += v * t; else { const u = t - T1; sB = u < T2 ? .2 - xr + vc * u : vc * (u - T2) - .5 * a * (u - T2) ** 2; sA = sB - .3; }
        const A = hillAt(xr, sA, 30), B = hillAt(xr, sB, 30), by = B[1]; D.cart(A[0], .2, 'A', A[1], A[2], sA); D.cart(B[0], .2, 'B', B[1], B[2], sB); if (t < T1) D.vel(A[0], .2, v, 0);
        return [`t ${f(t)} s`, `height ${f(by)} m`, t < T1 ? `v ${f(v)} m/s` : `v′ ${f(vc)} m/s`]; }}; },
  steps:(p, a) => { const vc = Math.sqrt(2 * g * p.h); return [`Speed needed after the crash: <span class="m">v′ = √(2gh) = √(2·9.8·${p.h}) = ${f(vc)} m/s</span>`, `Momentum in the crash: <span class="m">m₁v = (m₁ + m₂)v′</span>`, `<span class="m">v = (${p.m1} + ${p.m2})·${f(vc)}/${p.m1} = ${f(a)} m/s</span>`]; }},

{ch:2, name:'Knock it off the edge', sym:'v', unit:'m/s', word:'speed of ball A',
  story:p => `Ball A (<b>${p.m1} kg</b>) hits ball B (<b>${p.m2} kg</b>) in a perfectly elastic head-on collision. Ball B sits at the edge of a table <b>${p.H} m</b> high and must land <b>${p.d} m</b> from the edge. How fast must ball A be going?`,
  eqs:['v_B = 2m₁v / (m₁ + m₂)', 't = √(2H/g)', 'd = v_B·t'], idea:'Work backward. The landing tells you the speed B needs, and the elastic collision equation connects that to the speed of A.',
  gen:() => ({m1:rnd(.5, 2, .5), m2:rnd(.5, 2, .5), H:rnd(.8, 1.4, .2), d:rnd(1, 2.5, .5)}), ans:p => p.d * Math.sqrt(g / (2 * p.H)) * (p.m1 + p.m2) / (2 * p.m1), view:p => [-1.4, p.d * 1.5, p.H * 1.6],
  sim(p, v){ const vb = 2 * p.m1 * v / (p.m1 + p.m2), va = (p.m1 - p.m2) * v / (p.m1 + p.m2), tf = fallTime(p.H), land = vb * tf, hit = within(land, p.d, .03), T1 = v > 0 ? .9 / v : 0;
    return {T:T1 + tf, hit, miss:`Ball B landed ${shortLong(land, p.d, 'm')}.`, facts:[`Ball B left at ${f(vb)} m/s`, `Ball A kept moving at ${f(va)} m/s`, `Fall time: ${f(tf)} s, so B lands ${f(land)} m out`],
      draw(t, D){ const y = p.H; D.bench(-1.4, 0, y); D.pad(p.d, .03 * p.d); D.dim(0, p.d, -.12, `${p.d} m`); D.vdim(-.2, 0, y, `${p.H} m`);
        let ax, bx = 0, by = y; if (t < T1){ ax = -1 + v * t - .08; D.ball(0, y + .08, .08, 'B'); D.ball(ax, y + .1, .1, 'A'); D.vel(ax, y + .2, v, 0); }
        else { const q = t - T1, tE = va > 0 ? .18 / va : Infinity; ax = -.18 + va * q; bx = vb * q; by = y - .5 * g * q * q; const ay = q > tE ? y - .5 * g * (q - tE) ** 2 : y; D.ball(ax, Math.max(ay, 0) + .1, .1, 'A'); D.ball(bx, by + .08, .08, 'B'); D.vel(bx, by + .1, vb, -g * q); }
        return [`t ${f(t)} s`, `B x ${f(bx)} m`, `B y ${f(by)} m`]; }}; },
  steps:(p, a) => { const tf = fallTime(p.H), vb = p.d / tf; return [`Fall time: <span class="m">t = √(2·${p.H}/9.8) = ${f(tf)} s</span>`, `Speed B needs: <span class="m">v_B = ${p.d}/${f(tf)} = ${f(vb)} m/s</span>`, `Elastic collision: <span class="m">v = v_B(m₁ + m₂)/(2m₁) = ${f(a)} m/s</span>`]; }},

{ch:3, name:'Level the seesaw', sym:'x', unit:'m', word:'distance from the pivot',
  story:p => `A <b>${p.m1} kg</b> load sits <b>${p.d1} m</b> left of a seesaw's pivot. Where, measured from the pivot, must a <b>${p.m2} kg</b> load go on the right side so the beam balances?`,
  eqs:['τ = F·d', 'Στ = 0 in balance'], idea:'Balance is about torque, not weight alone. A small mass far from the pivot can balance a large mass close to it.',
  gen(){ for (;;){ const p = {m1:rnd(10, 40, 5), d1:rnd(.6, 1.6, .2), m2:rnd(10, 40, 5)}; if (p.m1 !== p.m2 && this.ans(p) < 2.2 && this.ans(p) > .3) return p; } }, ans:p => p.m1 * p.d1 / p.m2, view:() => [-3, 3, 1.5],
  sim(p, x){ const tL = p.m1 * g * p.d1, tR = p.m2 * g * x, hit = within(x, p.m1 * p.d1 / p.m2, .03), I = p.m1 * p.d1 ** 2 + p.m2 * x * x, al = Math.abs(tR - tL) / I, stop = Math.asin(.75 / 2.5), sign = tR > tL ? 1 : -1;
    return {T:hit ? 1 : clamp(Math.sqrt(2 * stop / al), .5, 4), hit, miss:`The ${tR > tL ? 'right' : 'left'} side dropped. Your load was ${shortLong(x, p.m1 * p.d1 / p.m2, 'm')}.`, facts:[`Left torque: ${p.m1}·9.8·${p.d1} = ${f(tL)} N·m`, `Right torque: ${p.m2}·9.8·${f(x)} = ${f(tR)} N·m`, `Net torque: ${f(Math.abs(tR - tL))} N·m`],
      draw(t, D){ const ang = hit || !x ? 0 : sign * Math.min(stop, .5 * al * t * t); D.ground(); D.pivot(0, .8); const P = q => [q * Math.cos(ang), .8 - q * Math.sin(ang)]; D.beam(P(-2.5), P(2.5));
        const [lx, ly] = P(-p.d1); D.weight(lx, ly, `${p.m1} kg`, .3, ang); if (x){ const [rx, ry] = P(Math.min(x, 2.5)); D.weight(rx, ry, `${p.m2} kg`, .3, ang); D.force(rx, ry, 0, -1, ''); } D.force(lx, ly, 0, -1, ''); D.dim(-p.d1, 0, .25, `${p.d1} m`); return [`left ${f(tL)} N·m`, `right ${f(tR)} N·m`]; }}; },
  steps:(p, a) => [`Balance the torques: <span class="m">m₁g·d₁ = m₂g·x</span>`, `g cancels: <span class="m">x = m₁d₁/m₂ = ${p.m1}·${p.d1}/${p.m2} = ${f(a)} m</span>`]},

{ch:3, name:'The heavy beam', sym:'x', unit:'m', word:'distance from the pivot',
  story:p => `A uniform <b>${p.L} m</b> beam of <b>${p.M} kg</b> rests on a pivot <b>${p.p} m</b> from its left end, so its long side wants to drop. Where left of the pivot should a <b>${p.m} kg</b> counterweight go to balance it?`,
  eqs:['A uniform beam acts at its center', 'τ = F·d', 'Στ = 0'], idea:'Treat the beam as a single weight at its center. The distance that matters is from the pivot to the center of the beam.',
  gen(){ for (;;){ const L = rnd(4, 6, 1), p = {L, M:rnd(10, 30, 5), p:rnd(1, L / 2 - .4, .2), m:rnd(15, 40, 5)}; const x = this.ans(p); if (x > .3 && x < p.p * .9) return p; } }, ans:p => p.M * (p.L / 2 - p.p) / p.m, view:p => [-p.p - .6, p.L - p.p + .6, 1.5],
  sim(p, x){ const arm = p.L / 2 - p.p, tB = p.M * g * arm, tW = p.m * g * x, hit = within(x, p.M * arm / p.m, .03), I = p.M * (p.L ** 2 / 12 + arm ** 2) + p.m * x * x, al = Math.abs(tW - tB) / I, leftDown = tW > tB, stop = Math.min(.5, Math.asin(.75 / (leftDown ? p.p : p.L - p.p))), sign = leftDown ? -1 : 1;
    return {T:hit ? 1 : clamp(Math.sqrt(2 * stop / al), .5, 4), hit, miss:`The ${tW > tB ? 'left' : 'right'} side dropped. The counterweight was ${shortLong(x, p.M * arm / p.m, 'm')}.`, facts:[`Beam's center is ${f(arm)} m from the pivot`, `Beam torque: ${f(tB)} N·m`, `Counterweight torque: ${f(tW)} N·m`],

/* ---------- link settings: ?level=1..16 & the level's numbers & mode=test & solution=0 ---------- */
const URLQ = new URLSearchParams(location.search);
const LINK = (() => {
  const raw = (URLQ.get('level') || '').trim();
  if (!raw) return null;
  let i = -1;
  const dot = raw.match(/^(\d+)\.(\d+)$/);   // chapter.level, as shown on the buttons, e.g. 2.3
  if (dot){ const ch = +dot[1] - 1, n = +dot[2]; let k = 0; LEVELS.forEach((L, j) => { if (L.ch === ch && ++k === n) i = j; }); }
  else if (/^\d+$/.test(raw)) i = +raw - 1;   // 1 to 16, counting straight through
  if (!LEVELS[i]) return null;
  const p = LEVELS[i].gen(), given = [];
  for (const k of Object.keys(p)){ const v = parseFloat(URLQ.get(k)); if (isFinite(v)){ p[k] = v; given.push(k); } }

})();
const MODE = (URLQ.get('mode') || '').toLowerCase();
const TEST = !!LINK && MODE === 'test';             // picture of the setup only; students answer elsewhere

    const n = sim.hit ? 46 : 16;
    for (let i = 0; i < n; i++){
      const a = -Math.random() * Math.PI, sp = 40 + Math.random() * (sim.hit ? 260 : 110);
      S.fx.push({x:cx, y:cy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:.7 + Math.random() * .7, s:2 + Math.random() * 3.5, c:sim.hit ? pick(['#ffd34d', '#ffffff', '#ff9c2b', '#7dffc1']) : '#d8c3a0'});
    }
  }
  fxLoop();
}
let fxOn = false, fxT = 0;
function fxLoop(){
  if (fxOn || !S.shown) return;
  fxOn = true; fxT = performance.now();
  const tick = now => {
    const dt = Math.min(.05, (now - fxT) / 1000); fxT = now;
    for (const q of S.fx){ q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt; q.life -= dt; }
    S.fx = S.fx.filter(q => q.life > 0);
    if (S.banner && !reduceMotion && now > S.banner.until) S.banner = null;
    if (S.run){ fxOn = false; return; }
    paint(S.shown.sim, S.shown.t);
    if (S.fx.length || (S.banner && !reduceMotion)) requestAnimationFrame(tick); else fxOn = false;
  };
  requestAnimationFrame(tick);
}
function resize(){
  const box = $('range'), wide = innerWidth > 900 && !BARE;
  const aw = box.clientWidth, ah = wide ? box.clientHeight : aw * .62;
  const nW = Math.floor(aw), nH = Math.floor(wide ? Math.min(ah, aw * .72) : ah), dpr = devicePixelRatio || 1;
  if (nW === W && nH === H && cv.width === Math.round(W * dpr)) return;   // the page reflowed but the range did not change size
  const r = nW / W; for (const q of S.strobe){ q[0] *= r; q[1] = nH - (H - q[1]) * r; q[2] *= r; }
  W = nW; H = nH;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  if (S.shown && !S.run) paint(S.shown.sim, S.shown.t);
}

/* ---------- game flow ---------- */
const lv = () => LEVELS[S.cur];
function loadLevel(i, fresh = true){
  S.cur = i; if (fresh) S.p = lv().gen();
  Object.assign(S, {tries:0, helped:false, solved:false, last:null, strobe:[], fx:[], banner:null}); cancelRun();
  const L = lv(), n = i - LEVELS.findIndex(x => x.ch === L.ch) + 1;
  $('tag').textContent = `Level ${L.ch + 1}.${n} · ${CHAPTERS[L.ch]}`;
  $('lvName').textContent = L.name;
  $('story').innerHTML = L.story(S.p);
  $('ansLabel').textContent = `${L.sym} (${L.unit})`;
  $('ans').value = ''; $('ans').setAttribute('aria-label', `${L.word} in ${L.unit}`); $('btnSign').hidden = !L.signed;
  $('eqs').innerHTML = L.eqs.map(e => `<li>${e}</li>`).join('');
  $('errMsg').hidden = true; $('debrief').hidden = true;
  store.set('proving-ground-cur', i);
  S.shown = {sim:L.sim(S.p, 0), t:0}; S.lastD = paint(S.shown.sim, 0);
  cv.setAttribute('aria-label', `Side view of the test range: ${L.name}. ${L.story(S.p).replace(/<[^>]+>/g, '')}`);
  renderNav();
}
function renderNav(){
  const nav = $('nav'); nav.textContent = '';
  CHAPTERS.forEach((c, ci) => {
    const g2 = document.createElement('div'); g2.className = 'group';
    const lab = document.createElement('span'); lab.textContent = c; g2.append(lab);
    let n = 0;
    LEVELS.forEach((L, i) => { if (L.ch !== ci) return; n++;
      const b = document.createElement('button'), s = best[i];
      b.type = 'button'; b.className = 'lv' + (i === S.cur ? ' cur' : '') + (s > 0 ? ' done' : s === -1 ? ' helped' : '');
      b.textContent = `${ci + 1}.${n}`; b.setAttribute('aria-label', `Level ${ci + 1}.${n}, ${L.name}${s > 0 ? `, ${s} of 3 stars` : ''}`);
      b.onclick = () => { if (!S.run) loadLevel(i); };
      g2.append(b); });
    nav.append(g2);
  });
  const stars = Object.values(best).reduce((a, x) => a + Math.max(0, x), 0);
  $('total').textContent = `★ ${stars} of ${LEVELS.length * 3}`;
}
let rafId = 0;
function cancelRun(){ cancelAnimationFrame(rafId); S.run = null; $('btnGo').disabled = false; }
$('btnSign').onclick = () => { const i = $('ans'), v = i.value.trim(); i.value = /^[-−]/.test(v) ? v.replace(/^[-−]\s*/, '') : '-' + v; i.focus(); };
function launch(){
  if (S.run || TEST) return;
  const raw = $('ans').value.trim().replace(',', '.').replace(/^−/, '-').replace(/^-\s+/, '-'), v = parseFloat(raw), err = $('errMsg'), sg = !!lv().signed;
  if (sg ? (!/^-?([0-9]*\.?[0-9]+|[0-9]+\.)$/.test(raw) || v === 0) : (!/^[0-9]*\.?[0-9]+$|^[0-9]+\.$/.test(raw) || !(v > 0))){ err.textContent = sg ? `Enter a number for ${lv().word}, in ${lv().unit}. It can be negative.` : `Enter a positive number for ${lv().word}, in ${lv().unit}.`; err.hidden = false; return; }
  err.hidden = true; $('debrief').hidden = true; S.last = v; S.tries++;
  const sim = lv().sim(S.p, v); $('btnGo').disabled = true;
  const T = Math.max(sim.T, .05), t0 = performance.now(), gap = T / 14; let nextGhost = gap;
  S.run = sim; S.shown = {sim, t:0}; S.strobe = []; S.fx = []; S.banner = null;
  const step = now => {
    const t = INSTANT ? T : Math.min(T, (now - t0) / 1000);
    S.shown.t = t; S.lastD = paint(sim, t);
    if (t >= nextGhost && t < T && S.lastD.moving){ S.strobe.push(S.lastD.moving.slice()); nextGhost += gap; }
    if (t < T) rafId = requestAnimationFrame(step); else finish(sim);
  };
  rafId = requestAnimationFrame(step);
}
function finish(sim){
  S.run = null; $('btnGo').disabled = false;
  const box = $('debrief'), line = $('resultLine'), L = lv();
  $('facts').innerHTML = sim.facts.map(x => `<li>${x}</li>`).join('');
  $('idea').textContent = L.idea;
  if (sim.hit){
    if (!S.solved){
      S.solved = true;
      const stars = S.helped ? 0 : Math.max(1, 4 - S.tries), prev = best[S.cur];
      if (stars > 0) best[S.cur] = Math.max(prev > 0 ? prev : 0, stars); else if (prev == null) best[S.cur] = -1;
      store.set('proving-ground-best', best);
      line.textContent = stars ? `On target on launch ${S.tries}. ${'★'.repeat(stars)}` : 'On target, using the worked solution.';
    } else line.textContent = 'On target again.';
    line.className = 'result hit';
    if (!NOSOL) showSteps();
    $('btnNext').hidden = LOCK || S.cur >= LEVELS.length - 1;
  } else {
    line.textContent = sim.miss; line.className = 'result miss';
    if (!S.helped) $('stepsBox').hidden = true;
    $('btnSolve').hidden = S.helped || NOSOL; $('btnNext').hidden = true;
  }
  box.hidden = false; renderNav(); celebrate(sim);
  if (!BARE) box.scrollIntoView({block:'nearest', behavior:reduceMotion ? 'auto' : 'smooth'});
  if (SHOW) showNext(sim);
}
function showSteps(){
  $('steps').innerHTML = lv().steps(S.p, lv().ans(S.p)).map(s => `<li>${s}</li>`).join('');
  $('stepsBox').hidden = false; $('btnSolve').hidden = true;
}
$('form').addEventListener('submit', e => { e.preventDefault(); $('ans').blur(); launch(); });
$('btnSolve').onclick = () => { if (NOSOL) return; S.helped = true; showSteps(); };
$('btnFresh').onclick = () => { if (!LOCK) loadLevel(S.cur); };
$('btnNext').onclick = () => { if (!LOCK) loadLevel(S.cur + 1); };
new ResizeObserver(resize).observe($('range'));
addEventListener('resize', resize);

/* ---------- show mode: the correct launch with values hidden, then the student's launch ---------- */
function showStart(){
  S.waiting = false; S.phase = 'target'; S.yourMiss = ''; HIDE = true;
  $('ans').value = lv().ans(S.p).toPrecision(6); launch();
}
function showNext(sim){
  if (S.phase === 'target' && HAS_STU){
    S.waiting = true;
    setTimeout(() => { S.waiting = false; HIDE = false; S.phase = 'yours'; $('ans').value = String(STU); launch(); }, 1600);
    return;
  }
  if (S.phase === 'yours') S.yourMiss = sim.hit ? '' : sim.miss;
  HIDE = false; S.phase = 'done';
  if (!HAS_STU) HIDE = true;   // keep the axis numbers and labels hidden after a target-only run
  paint(S.shown.sim, S.shown.t);
}

/* ---------- boot ---------- */
function start(){
  resize();
  if (LINK){ S.p = LINK.p; loadLevel(LINK.i, false); }
  else { const cur = store.get('proving-ground-cur', 0); loadLevel(LEVELS[cur] ? cur : 0); }
  if (document.fonts?.ready) document.fonts.ready.then(() => { if (S.shown && !S.run) paint(S.shown.sim, S.shown.t); });
  if (SHOW){
    $('scene').addEventListener('click', () => { if (!S.run && !S.waiting) showStart(); });
    S.waiting = true; setTimeout(showStart, 900);   // a moment to take in the setup first
  }
  if (SOLN){
    const go = () => { if (S.run) return; $('ans').value = lv().ans(S.p).toPrecision(6); launch(); };
    $('scene').addEventListener('click', go);
    setTimeout(go, 900);   // a moment to take in the setup first
  }
}
start();
})();
</script>
</body>
